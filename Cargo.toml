[workspace]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"

[package]
name = "amiscara-ssh"
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Frank Neumann-Staude <frank@staude.net>"]
description = "Shared SSH client of the Amiscara apps, built on russh"
repository = "https://github.com/staude/amiscara-ssh"
publish = false

[dependencies]
russh = "0.64.1"
russh-sftp = "3.0.1"
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["ed25519", "getrandom"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["net", "io-util", "time", "sync", "rt", "fs", "macros", "process"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3.27.0"
totp-rs = "6"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
